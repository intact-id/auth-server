spring:
  application:
    name: intact-id

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intact_id}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jackson:
    time-zone: Africa/Nairobi
    serialization:
      write-dates-as-timestamps: false

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Africa/Nairobi

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:intaactid@gmail.com}
    password: ${MAIL_PASSWORD:djtazwljxwtbxkqv}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration: 900000   # 15 minutes in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds
  issuer: intact-id-auth-server

webhook:
  enabled: true
  max-retries: 0
  timeout-seconds: 30
  retry-intervals: 60,300,900  # 1min, 5min, 15min in seconds
  signature-algorithm: HmacSHA256

verification:
  processing:
    enabled: true
    poll-interval-ms: 15000
    batch-size: 7
    max-concurrent: 4

face-service:
  url: ${FACE_SERVICE_URL}
  api-key: ${FACE_SERVICE_API_KEY}
  api-secret: ${FACE_SERVICE_API_SECRET}

ocr-service:
  url: ${OCR_SERVICE_URL}
  api-key: ${OCR_SERVICE_API_KEY}
  api-secret: ${OCR_SERVICE_API_SECRET}

ocr:
  confidence:
    threshold: ${OCR_CONFIDENCE_THRESHOLD:0.65}
  name:
    similarity:
      threshold: ${OCR_NAME_SIMILARITY_THRESHOLD:0.85}

app:
  documents:
    base-dir: ${APP_DOCUMENTS_BASE_DIR:${user.dir}/uploads}
  support-email: ${SUPPORT_EMAIL:support@intact-id.com}
  base-url: ${APP_BASE_URL:https://intact-id.com}
  track-url: ${TRACK_URL:https://id.intact-io.com}
  dashboard-url: ${DASHBOARD_URL:https://dashboard.intact-id.com}
  docs-url: ${DOCS_URL:https://docs.intact-id.com}

# CORS — origins supplied via env var (comma-separated)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.intact_id.client.face.FaceScreeningClient: DEBUG
    com.intact_id.client.ocr.OcrScreeningClient: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    doc-expansion: none
    default-models-expand-depth: -1
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.intact_id
  paths-to-match: /api/**
  show-actuator: false
