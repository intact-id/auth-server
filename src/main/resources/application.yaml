spring:
  application:
    name: intact-id

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:intact_id}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    doc-expansion: none
    default-models-expand-depth: -1
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.intact_id
  paths-to-match: /api/**
  show-actuator: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging
logging:
  level:
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    com.intact_id: DEBUG