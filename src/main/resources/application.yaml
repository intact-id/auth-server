spring:
  server:
    port: ${SERVER_PORT:8081}
  application:
    name: intact-id

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:intact_id}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:intaactid@gmail.com}
    password: ${MAIL_PASSWORD:djtazwljxwtbxkqv}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    doc-expansion: none
    default-models-expand-depth: -1
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.intact_id
  paths-to-match: /api/**
  show-actuator: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /


# Logging
logging:
  level:
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    com.intact_id: DEBUG

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration: 900000 # 15 minutes in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds
  issuer: intact-id-auth-server

# Webhook Configuration
webhook:
  enabled: true
  max-retries: 0
  timeout-seconds: 30
  retry-intervals: 60,300,900  # 1min, 5min, 15min in seconds
  signature-algorithm: HmacSHA256

# Verification Processing (rate-limited scheduler)
verification:
  processing:
    enabled: true
    poll-interval-ms: 15000
    batch-size: 7
    delay-between-calls-ms: 7000

# Face Screening Service
face-service:
  url: ${FACE_SERVICE_URL:http://localhost:8000}
  api-key: ${FACE_SERVICE_API_KEY:test_api_key_12345}
  api-secret: ${FACE_SERVICE_API_SECRET:test_secret_67890}