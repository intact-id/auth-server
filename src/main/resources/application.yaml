spring:
  application:
    name: intact-id

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:intact_id}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jackson:
    time-zone: Africa/Nairobi
    serialization:
      write-dates-as-timestamps: false

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Africa/Nairobi

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:intaactid@gmail.com}
    password: ${MAIL_PASSWORD:djtazwljxwtbxkqv}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /
  # Honour X-Forwarded-* only from private-network proxies (Tomcat RemoteIpValve defaults)
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration: 900000   # 15 minutes in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds
  mfa-challenge-expiration: 300000  # 5 minutes in milliseconds
  company-access-token-expiration: 1800000  # 30 minutes in milliseconds — POST /api/v1/auth/token
  issuer: intact-id-auth-server

# Caching (Caffeine) + rate limiting for the company access-token flow (POST /api/v1/auth/token).
# Cache TTLs are derived from jwt.company-access-token-expiration above, not set here, so they
# can never outlive the token they're backing.
company-access-token:
  company-cache-max-size: 10000
  denylist-max-size: 50000
  rate-limit-window-seconds: 60
  rate-limit-max-attempts: 10

# Caffeine cache for CompanyBillingProfile reads that never mutate the balance
# (checkSufficientBalance, billing summary/profile GETs). Money-mutating paths
# (debitWallet, topUpWallet) always bypass this and read the DB fresh — see BillingService.
billing:
  profile-cache-ttl-seconds: 30
  profile-cache-max-size: 5000


kafka:
  enabled: ${KAFKA_ENABLED:true}

webhook:
  enabled: true
  max-retries: 0
  timeout-seconds: 30
  retry-intervals: 60,300,900  # 1min, 5min, 15min in seconds
  signature-algorithm: HmacSHA256

verification:
  processing:
    enabled: true
    poll-interval-ms: 15000
    batch-size: 7
    max-concurrent: 4

face-service:
  url: ${FACE_SERVICE_URL:http://localhost:8000}
  api-key: ${FACE_SERVICE_API_KEY:test_api_key_12345}
  api-secret: ${FACE_SERVICE_API_SECRET:test_secret_67890}

ocr-service:
  url: ${OCR_SERVICE_URL:http://localhost:8001}
  api-key: ${OCR_SERVICE_API_KEY:your_ocr_api_key}
  api-secret: ${OCR_SERVICE_API_SECRET:your_ocr_api_secret}

ocr:
  confidence:
    threshold: ${OCR_CONFIDENCE_THRESHOLD:0.65}
  name:
    similarity:
      threshold: ${OCR_NAME_SIMILARITY_THRESHOLD:0.85}

# billing-service's POST /v1/billing-profile/check-balance — no auth required. Called from
# RemoteBalanceCheckService before each verification is processed. Own short Feign timeout
# (BillingServiceFeignConfig), not the 120s face/OCR default.
billing-service:
  url: ${BILLING_SERVICE_URL:http://localhost:8086}

app:
  documents:
    base-dir: ${APP_DOCUMENTS_BASE_DIR:${user.dir}/uploads}
  support-email: ${SUPPORT_EMAIL:support@intact-id.com}
  base-url: ${APP_BASE_URL:https://intact-id.com}
  track-url: ${TRACK_URL:https://id.intact-io.com}
  dashboard-url: ${DASHBOARD_URL:https://dashboard.intact-id.com}
  docs-url: ${DOCS_URL:https://docs.intact-id.com}

kyc:
  storage:
    type: ${KYC_STORAGE_TYPE:local}
    local:
      base-dir: ${APP_DOCUMENTS_BASE_DIR:${user.dir}/uploads}
  drafts:
    ttl: ${KYC_DRAFT_TTL:24h}
    token-ttl: 15m
    cleanup-interval-ms: 900000
  handoff:
    code-ttl: 10m
    mobile-base-url: ${KYC_WIDGET_MOBILE_URL:http://localhost:5173/m}
    claim-max-attempts: 20
    claim-window: 10m

# CORS — origins supplied via env var (comma-separated)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

logging:
  level:
    com.intact_id.client.face.FaceScreeningClient: DEBUG
    com.intact_id.client.ocr.OcrScreeningClient: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    doc-expansion: none
    default-models-expand-depth: -1
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.intact_id
  paths-to-match: /api/**
  show-actuator: false

