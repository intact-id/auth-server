spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Dev CORS — localhost dev servers; override by setting CORS_ALLOWED_ORIGINS in your .env
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://intact-id.vercel.app/,http://localhost:5173,http://localhost:5174,http://localhost:5175,https://playmate-heaving-utter.ngrok-free.dev}

# Dev fallbacks — point at the local docker containers so the app boots without
# a .env file (Spring Boot doesn't read .env itself; only docker-compose does).
# Override any of these via env vars for a different local setup.
face-service:
  url: ${FACE_SERVICE_URL:http://localhost:8000}
  api-key: ${FACE_SERVICE_API_KEY:test_api_key_12345}
  api-secret: ${FACE_SERVICE_API_SECRET:test_secret_67890}

ocr-service:
  url: ${OCR_SERVICE_URL:http://localhost:8001}
  api-key: ${OCR_SERVICE_API_KEY:dev_placeholder}
  api-secret: ${OCR_SERVICE_API_SECRET:dev_placeholder}

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.intact_id: DEBUG
