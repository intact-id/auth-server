services:

  auth-server:
    image: ${DOCKERHUB_USERNAME}/intact-auth:latest
    container_name: intact-auth
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - /var/data/intact-id/uploads:/var/data/intact-id/uploads
    networks:
      - app-net
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-net:
    external: true   # already exists — shared with postgres and face-service
