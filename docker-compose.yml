services:

  auth-server:
    image: ${DOCKERHUB_USERNAME}/intact-auth:latest
    container_name: intact-auth
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - /var/data/intact-id/uploads:/var/data/intact-id/uploads
    networks:
      - app-net
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Single-node KRaft broker (no Zookeeper). auth-server only produces to this — it's the
  # billing-events producer; the consumer is a separate service pointed at the same broker.
  # KAFKA_ENABLED and KAFKA_BOOTSTRAP_SERVERS=kafka:9092 go in .env when ready to turn this on;
  # until then auth-server starts fine even if this container isn't up (kafka.enabled=false).
  kafka:
    image: apache/kafka:3.8.0
    container_name: intact-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Fixed so the container keeps the same cluster identity across restarts. Regenerate with
      # `docker run --rm apache/kafka:3.8.0 /opt/kafka/bin/kafka-storage.sh random-uuid` if you
      # need a different one — any valid 16-byte base64 UUID works, this one has no special meaning.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  app-net:
    external: true   # already exists — shared with postgres and face-service

volumes:
  kafka-data:
